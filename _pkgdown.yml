# Website configuration for dppca (pkgdown)
# Tutorial filenames must match the .Rmd files in vignettes/.
url: https://yejinjo0220.github.io/dppca/

template:
  bootstrap: 5
  bootswatch: minty
  math-rendering: katex

home:
  title: "dppca"
  description: >
    Tools for differentially private principal component analysis (PCA)
    and visualization, including private PC directions, scree and PVE
    summaries, score plots, and integrated PCA displays.

navbar:
  title: "dppca"
  structure:
    left: [tutorials, methodology, algorithms, shiny, reference]
    right: [search, github]
  components:
    tutorials:
      text: Tutorials
      menu:
        - text: Getting Started
          href: articles/tutorials-getting-started.html
        - text: DP Loading Plot
          href: articles/tutorials-loading-plots.html
        - text: DP Scree Plot
          href: articles/tutorials-scree-plots.html
        - text: DP Score Plot
          href: articles/tutorials-score-plots.html
        - text: DP PCA Visualization
          href: articles/tutorials-dp-visualization.html

    methodology:
      text: Methodology
      menu:
        - text: PCA Background
          href: articles/method-pca-background.html
        - text: DP Directions
          href: articles/method-dp-loading.html
        - text: DP Eigenvalues
          href: articles/method-dp-scree.html
        - text: DP Scores
          href: articles/method-dp-score.html
        - text: DP PCA Visualization
          href: articles/method-dp-visualization.html

    algorithms:
      text: Algorithms
      href: articles/algorithms.html

    shiny:
      text: Shiny App
      href: articles/shiny-app.html

    reference:
      text: Function
      href: reference/index.html

# Article index. Keep the same filenames as the .Rmd vignettes.
articles:
  - title: Tutorials
    desc: Practical guides to estimating and visualizing DP PCA quantities.
    contents:
      - tutorials-getting-started
      - tutorials-loading-plots
      - tutorials-scree-plots
      - tutorials-score-plots
      - tutorials-dp-visualization

  - title: Methodology
    desc: Background and mathematical methods for DP PCA visualization.
    contents:
      - method-pca-background
      - method-dp-loading
      - method-dp-scree
      - method-dp-score
      - method-dp-visualization

  - title: Algorithms
    contents:
      - algorithms

  - title: Shiny Application
    desc: Launch and explore the online interactive dppca app.
    contents:
      - shiny-app

reference:
  - title: Integrated DP PCA
    desc: Estimate shared private PCA quantities and display five visualizations.
    contents:
      - dp_pca
      - plot.dp_pca

  - title: DP Loading
    desc: Estimate and visualize private principal component directions.
    contents:
      - dp_loading
      - plot.dp_loading
      - loading_plot_control

  - title: DP Scree and PVE
    desc: Estimate private scree values and proportions of variance explained.
    contents:
      - dp_scree
      - plot.dp_scree
      - scree_plot_control
      - clipped_control
      - pmwm_control
      - huber_control


  - title: DP Score Plots
    desc: Private histograms, sampled score plots, and grouped scores.
    contents:
      - dp_score
      - plot.dp_score
      - score_plot_control
      - sampling_control

  - title: Privacy Controls
    desc: Allocate privacy budgets for the estimation steps.
    contents:
      - privacy_control

  - title: Shiny Application
    desc: Launch the optional interactive app (separate from the tutorials).
    contents:
      - dppca_app

  - title: Example Datasets
    contents:
      - gau
      - gau_g
      - vowel

  # Keep documentation for the grouped S3 plot method directly accessible,
  # but do not list it as a separate public fitting/plotting interface.
  - title: internal
    contents:
      - plot.dp_score_group
